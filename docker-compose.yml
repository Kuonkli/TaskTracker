services:
  postgres:
    image: postgres:16-alpine
    container_name: task-tracker-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      USER_PASSWORD: ${USER_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - task-tracker-network
    restart: unless-stopped

  backend:
    image: task-tracker-backend:latest
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: task-tracker-backend
    expose:
      - "8080"
    environment:
      DB_HOST: task-tracker-postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-task_tracker_db}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT:-8080}
      UPLOADS_PATH: /var/lib/task-tracker/uploads
      UPLOADS_URL: /api/attachments
    volumes:
      - uploads_data:/var/lib/task-tracker/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-I", "http://localhost:${PORT:-8080}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - task-tracker-network
    restart: unless-stopped

  frontend:
    image: task-tracker-frontend:latest
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-/api}
    container_name: task-tracker-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - task-tracker-network
    restart: unless-stopped

  migrate:
    image: migrate/migrate:latest
    volumes:
      - ./database/migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://task_tracker_admin:${ADMIN_PASSWORD}@task-tracker-postgres:5432/${DB_NAME}?sslmode=${DB_SSLMODE}"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - task-tracker-network
    restart: "no"

volumes:
  postgres_data:
  uploads_data:

networks:
  task-tracker-network:

    driver: bridge


